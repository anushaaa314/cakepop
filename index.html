<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pufferfish Ballon Pop</title>
<link rel="stylesheet" href="style.css"/>

</head>

<body>

<div id="gameArea">

    <canvas id="myCanvas"></canvas>
    <div id="gameOverMessage">GAME OVER!</div>
    <div id="eatPrompt">
        <h1>eat the cake?</h1>
        <button id="btnEat">yesyesyesss</button>
    </div>
    <div id="fishInstruction">
        click to eat the cake...
    </div>
    <div id="oopsMessage">
        oops...
    </div>
    
    <div id="startScreen">
        <h1>CakePop</h1>
        <p style="color:#aaa">use arrow keys or a/d to move</p>
        <button id="btnStart">START</button>
        <link rel="stylesheet" href= "style.css">
        
    </div>

    <button id="btnRestart">Restart</button>

</div>

<script>

// grab the canvas
var canvas = document.getElementById("myCanvas");
var ctx = canvas.getContext("2d");
var startscreen = document.getElementById("startScreen")

var ballImage = new Image();
ballImage.src = "IMG_6571-removebg-preview.png"

var balloonImage = new Image();
balloonImage.src = "IMG_6577-removebg-preview.png"

var cakeImage = new Image();
cakeImage.src = "IMG_6575-removebg-preview.png"

var cake = {
    x: 360,
    y: -20,
    w: 150,
    h: 180
};

var gameRunning = false;
var explosionActive = false;
var ballExploded = false;
var gameOver = false;
var fishScreenActive = false;
var eatPrompt = document.getElementById("eatPrompt");
var btnEat = document.getElementById("btnEat");

// particles array
var parts = [];


// paddle stuff
var paddle = {
    x: 0,
    y: 0,
    width: 120,
    height: 16,
    spd: 8
};

// ball stuff
// squish values for the squash and stretch effect
var ball = {
    x: 200, y: 200,
    vx: 4, vy: -4,
    radius: 43,
    sqX: 1,
    sqY: 1
};

// keyboard input
var keys = { left: false, right: false };

document.addEventListener("keydown", function(e) {
    if (e.key == "ArrowLeft" || e.key == "a") keys.left = true;
    if (e.key == "ArrowRight" || e.key == "d") keys.right = true;
});

document.addEventListener("keyup", function(e) {
    if (e.key == "ArrowLeft" || e.key == "a") keys.left = false;
    if (e.key == "ArrowRight" || e.key == "d") keys.right = false;
});

// bricks
var bricks = [];
var ROWS = 3;
var COLS = 9;

function buildBricks() {
    bricks = []; // clear first
    var spacing = 8;
    var brickW = (canvas.width - 60) / COLS - spacing;
    var brickH = 50;
    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var bx = 20 + c * (brickW + spacing);
            var by = 150 + r * (brickH + spacing);
            bricks.push({ x: bx, y: by, w: brickW, h: brickH, alive: true });
        }
    }
}

function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    // move paddle to bottom when resized
    paddle.y = canvas.height - 30;
}

window.addEventListener("resize", function() {
    resizeCanvas();
});

function resetBall() {
    ball.x = canvas.width / 2;
    ball.y = canvas.height / 1.2;
    ball.vx = 4;
    ball.vy = -4;
    ball.sqX = 1;
    ball.sqY = 1;
    paddle.x = canvas.width / 2 - paddle.width / 2;
}

// called when ball hits something - does squish + particles
function doImpact(dir) {
    // squash the ball depending on which direction it bounced
    if (dir == "cake") {

    gameRunning = false;
    explosionActive = true;
    ballExploded = true;

    for (var i = 0; i < 60; i++) {
        parts.push({
            x: ball.x,
            y: ball.y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            alpha: 1.0,
            col: ["pink", "purple", "yellow", "cyan", "green"][
                Math.floor(Math.random() * 5)
            ]
        });
    }

    return;
    }
    if (dir == "horiz") {
        ball.sqX = 0.65;
        ball.sqY = 1.35;
    } else {
        ball.sqX = 1.35;
        ball.sqY = 0.65;
    }

    // spawn some particles
    for (var i = 0; i < 12; i++) {
        parts.push({
            x: ball.x,
            y: ball.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            alpha: 1.0,
            col: "DeepPink"
        });
    }
}

// same but pink for balloons
function brickParticles(bx, by) {
    for (var i = 0; i < 12; i++) {
        parts.push({
            x: bx,
            y: by,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            alpha: 1.0,
            col: "pink"
        });
    }
}

function updateAndDrawParticles() {
    var stillAlive = [];
    for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha > 0) {
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.col;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
            stillAlive.push(p);
        }
    }
    ctx.globalAlpha = 1;
    parts = stillAlive;
}

function drawBricks() {
    for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];

        if (!b.alive) continue;

        ctx.drawImage(
            balloonImage,
            b.x,
            b.y,
            b.w,
            b.h
        );
    }
}

function drawPaddle() {
    ctx.shadowBlur = 20;
    ctx.fillStyle = "DeepPink";
    ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    ctx.shadowBlur = 0;
}


function drawBall() {
    ctx.save();
    ctx.translate(ball.x, ball.y);
    ctx.scale(ball.sqX, ball.sqY);
    ctx.drawImage(
        ballImage,
        -ball.radius,
        -ball.radius,
        ball.radius * 2,
        ball.radius * 2
    );
    ctx.restore();
}

function drawCake() {
    ctx.drawImage(
        cakeImage,
        cake.x,
        cake.y,
        cake.w,
        cake.h
    );
}

function updatePaddle() {
    if (keys.left) paddle.x -= paddle.spd;
    if (keys.right) paddle.x += paddle.spd;
    // clamp to screen
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
}

function updateBall() {
    ball.x += ball.vx;
    ball.y += ball.vy;

    // wall bounces
    if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.vx *= -1;
        doImpact("horiz");
    }
    if (ball.y - ball.radius < 0) {
        ball.vy *= -1;
        doImpact("vert");
    }

    // paddle collision
    // check if ball is at paddle height and within x range and moving downward
    if (ball.vy > 0 &&
        ball.y + ball.radius >= paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width)
    {
        // angle depends on where it hits the paddle
        var hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        ball.vx = hitPos * 5;
        ball.vy = ball.vy * -1;
        doImpact("vert");
    }

        // fell off the bottom - game over
    if (ball.y - ball.radius > canvas.height) {
        gameRunning = false;
        gameOver = true;

        document.getElementById("gameOverMessage").style.display = "block";
    }

    ball.sqX += (1 - ball.sqX) * 0.15;
    ball.sqY += (1 - ball.sqY) * 0.15;
}

function checkBrickCollisions() {
    for (var i = 0; i < bricks.length; i++) {
        var b = bricks[i];
        if (!b.alive) continue;

        // nearest point on brick rect to ball center
        var nearX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
        var nearY = Math.max(b.y, Math.min(ball.y, b.y + b.h));

        var distX = ball.x - nearX;
        var distY = ball.y - nearY;
        var dist = Math.sqrt(distX * distX + distY * distY);

        if (dist < ball.radius) {
            b.alive = false;
            ball.vy *= -1;
            doImpact("vert");
            brickParticles(ball.x, ball.y);
        }
    }
}

function checkCakeCollision() {

    if (gameOver) return;

    var nearX = Math.max(cake.x, Math.min(ball.x, cake.x + cake.w));
    var nearY = Math.max(cake.y, Math.min(ball.y, cake.y + cake.h));

    var distX = ball.x - nearX;
    var distY = ball.y - nearY;

    var dist = Math.sqrt(distX * distX + distY * distY);

    if (dist < ball.radius) {
    gameOver = true;
    gameRunning = false;

    eatPrompt.style.display = "flex";
    }
}

function goToStartScreen() {
    gameRunning = false;
    explosionActive = false;
    ballExploded = false;
    gameOver = false;

    parts = [];

    startScreen.style.display = "flex";
}

function gameLoop() {

    requestAnimationFrame(gameLoop);

    if (!gameRunning && !explosionActive && !fishScreenActive) return;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Special fish-growing screen
    if (fishScreenActive) {

        if (explosionActive) {
            updateAndDrawParticles();

            if (parts.length == 0) {
                explosionActive = false;
                fishScreenActive = false;
                        
                document.getElementById("oopsMessage").style.display = "block";
            }
        } else {
            drawBall();
        }

        return;
    }

    drawCake();

    if (explosionActive) {
        updateAndDrawParticles();

        if (parts.length == 0) {
            explosionActive = false;
        }

        return;
    }

    updatePaddle();
    updateBall();

    checkBrickCollisions();
    checkCakeCollision();

    updateAndDrawParticles();
    drawBricks();
    drawPaddle();

    if (!ballExploded) {
        drawBall();
    }
}

// button handlers

var btnStart = document.getElementById("btnStart");
var btnRestart = document.getElementById("btnRestart");
var startScreen = document.getElementById("startScreen");

btnStart.onclick = function() {
    startScreen.style.display = "none";
    btnRestart.style.display = "block";

    parts = [];
    gameOver = false;
    explosionActive = false;
    ballExploded = false;

    gameRunning = true;

    resizeCanvas();
    buildBricks();
    resetBall();
};

btnRestart.onclick = function() {
    location.reload();
};

btnEat.onclick = function() {
    document.getElementById("fishInstruction").style.display = "block";
    eatPrompt.style.display = "none";

    fishScreenActive = true;
    explosionActive = false;
    ballExploded = false;

    parts = [];

    ball.x = canvas.width / 2;
    ball.y = canvas.height / 2;
    ball.radius = 43;
    ball.sqX = 1;
    ball.sqY = 1;
};


canvas.addEventListener("click", function(e) {
    if (!fishScreenActive || explosionActive) return;

    var rect = canvas.getBoundingClientRect();

    var mouseX = (e.clientX - rect.left) * canvas.width / rect.width;
    var mouseY = (e.clientY - rect.top) * canvas.height / rect.height;

    var dx = mouseX - ball.x;
    var dy = mouseY - ball.y;

    var distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < ball.radius) {
        ball.radius += 12;

        if (ball.radius >= 140) {
            ballExploded = true;
            explosionActive = true;

            for (var i = 0; i < 80; i++) {
                parts.push({
                    x: ball.x,
                    y: ball.y,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.5) * 18,
                    alpha: 1,
                    col: ["pink", "purple", "yellow", "cyan", "green"][
                        Math.floor(Math.random() * 5)
                    ]
                });
            }
        }
    }
});

// init
resizeCanvas();
buildBricks();
resetBall();
gameLoop();

</script>
</body>
</html>
