<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pufferfish Ballon Pop</title>
<link rel="stylesheet" href="style.css"/>

</head>

<body>

<div id="gameArea">

    <canvas id="myCanvas"></canvas>
    <div id="gameOverMessage">GAME OVER!</div>
    <div id="eatPrompt">
        <h1>eat the cake?</h1>
        <button id="btnEat">yesyesyesss</button>
    </div>
    <div id="fishInstruction">
        click to digest...
    </div>
    <div id="oopsMessage">
        oops...
    </div>
    
    <div id="startScreen">
        <h1 id="title">CakePop!</h1>
        <p style="color:#aaa">use arrow keys or a/d to move</p>
        <button id="btnStart">START</button>
        <link rel="stylesheet" href= "style.css">
        
    </div>

    <button id="btnRestart">Restart</button>

</div>
<script src="script.js"></script>
</body>
</html>
